<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // On Android the page draws under the system bars and pads itself with
      // the safe-area insets (packages/app/src/styles/shell.css). Capacitor's
      // SystemBars plugin reads viewport-fit=cover from this tag. iOS keeps
      // its content inset.
      if (window.Capacitor?.getPlatform?.() === "android") {
        const viewport = document.querySelector('meta[name="viewport"]');
        viewport.content += ", viewport-fit=cover";
      }
    </script>
    <meta name="theme-color" content="#181916" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="A focused workspace for the things worth keeping."
    />
    <title>Balebase — Workspace</title>
    <script>
      // Applies the saved theme before first paint; mirrors packages/app/src/theme.ts.
      (() => {
        let preference = null;
        try {
          preference = localStorage.getItem("balebase.theme");
        } catch {
          // Storage can be unavailable in privacy-restricted browser contexts.
        }
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#181916" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Sign in to Balebase, the small business management workspace for expenses, contracts, employee paperwork, equipment, documents, and audits."
    />
    <title>Balebase — Small business management workspace</title>
    <!-- vite.config.ts adds the canonical link, or staging's noindex. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Balebase" />
    <meta
      property="og:title"
      content="Balebase — Small business management workspace"
    />
    <meta
      property="og:description"
      content="Sign in to Balebase, the small business management workspace for expenses, contracts, employee paperwork, equipment, documents, and audits."
    />
    <!-- The website publishes this image (packages/website/src/search.ts). -->
    <meta property="og:image" content="https://balebase.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Balebase logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Applies the saved theme before first paint; mirrors packages/app/src/theme.ts.
      (() => {
        let preference = null;
        try {
          preference = localStorage.getItem("balebase.theme");
        } catch {
          // Storage can be unavailable in privacy-restricted browser contexts.
        }
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

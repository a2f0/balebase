<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <title>Balebase</title>
  <!--
    One viewBox unit is one pixel of the 16px favicon. Keep every shape a
    whole-unit <rect>: packages/ui/scripts/buildImages.ts renders this file at
    whole-number scales and rejects anything else.
  -->
  <!-- Lime tile with stepped corners. -->
  <rect x="2" y="0" width="12" height="1" fill="#b7ff5b"/>
  <rect x="1" y="1" width="14" height="1" fill="#b7ff5b"/>
  <rect x="0" y="2" width="16" height="12" fill="#b7ff5b"/>
  <rect x="1" y="14" width="14" height="1" fill="#b7ff5b"/>
  <rect x="2" y="15" width="12" height="1" fill="#b7ff5b"/>
  <!-- Ink B: two-unit strokes with stepped bowl corners. -->
  <rect x="4" y="3" width="6" height="1" fill="#181916"/>
  <rect x="4" y="4" width="7" height="1" fill="#181916"/>
  <rect x="4" y="5" width="2" height="2" fill="#181916"/>
  <rect x="10" y="5" width="2" height="2" fill="#181916"/>
  <rect x="4" y="7" width="7" height="2" fill="#181916"/>
  <rect x="4" y="9" width="2" height="2" fill="#181916"/>
  <rect x="10" y="9" width="2" height="2" fill="#181916"/>
  <rect x="4" y="11" width="7" height="1" fill="#181916"/>
  <rect x="4" y="12" width="6" height="1" fill="#181916"/>
</svg>

# CLI-only local stack. Keep the API on loopback and backing services private.
services:
  mongodb:
    ports: !reset []
  redis:
    ports: !reset []
  azurite:
    # The host Codex judge reads artifacts from this local emulator endpoint.
    ports: !override ["127.0.0.1:10102:10000"]
  lowkey-vault:
    ports: !reset []
  judge:
    image: localhost/balebase-scope-judge:latest
    profiles: !override [copilot-judge]
    ports: !reset []
  token-manager:
    image: localhost/balebase-scope-token-manager:latest
    ports: !reset []
  devproxy-claude-code:
    ports: !reset []
  api:
    image: localhost/balebase-scope-api:latest
    ports: !override
      - "127.0.0.1:3100:80"
    environment:
      # Scope supports anonymous local operation when all IdP settings are empty.
      AUTH_PROVIDER: ""
      AUTH_AUTHORITY: ""
      AUTH_API_CLIENT_ID: ""
      AUTH_SCOPES: ""
      AUTH_ISSUER_TEMPLATE: ""
      AUTH_JWKS_URI: ""
      AUTH_BOOTSTRAP_ADMINS: ""
      AUTH_BOOTSTRAP_TENANTS: ""
      NODE_EXTRA_CA_CERTS: ""
  db-migrate:
    image: localhost/balebase-scope-db-migrate:latest
  scheduler:
    image: localhost/balebase-scope-scheduler:latest
  register-agents:
    environment:
      SCOPE_REGISTER_CLAUDE_CODE_AGENT: "true"
  model-scanner-anthropic:
    image: localhost/balebase-scope-model-scanner-anthropic:latest
    # Model discovery requires an API key; subscription OAuth can run the worker.
    profiles: !override [anthropic-model-scanner]
  coder-acp-claude-code:
    # Qualify local image names so Podman uses the newly built image on rebuilds.
    image: localhost/balebase-scope-coder-acp-claude-code:latest
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      JUDGE_SERVICE_URL: ${SCOPE_JUDGE_URL:-http://host.docker.internal:3202}
    volumes:
      - claude_projects:/home/node/.claude/projects
    # Nested volume mounts otherwise create a root-owned parent directory.
    # Keep non-project CLI state writable but ephemeral across restarts.
    tmpfs:
      - /home/node/.claude:mode=1777
    depends_on:
      judge: !reset null
      claude-sessions-init:
        condition: service_completed_successfully
  claude-sessions-init:
    image: busybox:1.37.0
    command: ["chown", "1000:1000", "/sessions"]
    volumes:
      - claude_projects:/sessions
    restart: "no"

volumes:
  claude_projects:

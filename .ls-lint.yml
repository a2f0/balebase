ls:
  .dir: regex:[A-Za-z0-9][A-Za-z0-9-]*
  .*: regex:[A-Za-z0-9][A-Za-z0-9._-]* | regex:README

ignore:
  - .git
  - "**/.*"
  - node_modules
  - packages/*/node_modules
  - dist
  - packages/*/dist
  - .turbo
  - packages/*/.turbo
  - packages/*/.astro
  - packages/*/.wrangler
  # Native SDKs require names such as App.xcodeproj and mipmap-anydpi-v26.
  - packages/app-capacitor/ios
  - packages/app-capacitor/android

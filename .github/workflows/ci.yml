name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Require Bun for repository commands
        run: |
          guard_dir="$RUNNER_TEMP/bun-only"
          mkdir -p "$guard_dir"
          for command in node npm npx; do
            cat > "$guard_dir/$command" <<'EOF'
          #!/bin/sh
          echo "Use Bun instead of $0 for repository commands." >&2
          exit 1
          EOF
            chmod +x "$guard_dir/$command"
          done
          echo "$guard_dir" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun run install:dependencies --frozen-lockfile

      - name: Run checks
        run: bun run check

      - name: Run tests
        run: bun run test

      - name: Set up Chrome for browser tests
        uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Test browser layout
        run: bun run --cwd packages/client test:browser
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Build applications
        run: bun run build

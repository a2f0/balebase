name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.13
          install_args: bun

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0.7"
          bundler-cache: true
          working-directory: packages/app-capacitor

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Require Bun for repository commands
        run: |
          guard_dir="$RUNNER_TEMP/bun-only"
          mkdir -p "$guard_dir"
          for command in node npm npx; do
            cat > "$guard_dir/$command" <<'EOF'
          #!/bin/sh
          echo "Use Bun instead of $0 for repository commands." >&2
          exit 1
          EOF
            chmod +x "$guard_dir/$command"
          done
          echo "$guard_dir" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun run install:dependencies --frozen-lockfile

      - name: Check managed agent skills
        run: bun run agents:check

      - name: Run checks
        run: bun run check

      - name: Run tests
        run: bun run test
        env:
          FASTLANE_OPT_OUT_USAGE: "1"
          FASTLANE_SKIP_UPDATE_CHECK: "1"

      - name: Set up Chrome for browser tests
        uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Test browser layout
        run: |
          bun run --cwd packages/app test:browser
          bun run --cwd packages/app-capacitor test:browser
          bun run --cwd packages/website test:browser
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Build applications
        run: bun run build

      - name: Build and sync mobile applications
        run: |
          bun run mobile:sync
          native_paths=(packages/app-capacitor/ios packages/app-capacitor/android)
          test -z "$(git status --porcelain -- "${native_paths[@]}")" || {
            git status --short -- "${native_paths[@]}"
            exit 1
          }

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.0
          install_args: bun

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6

      # setup-ruby reads a version file only from working-directory, which has
      # none; the Gemfile uses the root .ruby-version, so keep this in step.
      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "4.0.9"
          bundler-cache: true
          working-directory: packages/app-capacitor

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Require Bun for repository commands
        run: |
          guard_dir="$RUNNER_TEMP/bun-only"
          mkdir -p "$guard_dir"
          for command in node npm npx; do
            cat > "$guard_dir/$command" <<'EOF'
          #!/bin/sh
          echo "Use Bun instead of $0 for repository commands." >&2
          exit 1
          EOF
            chmod +x "$guard_dir/$command"
          done
          echo "$guard_dir" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun run install:dependencies --frozen-lockfile

      - name: Check branch policy
        if: github.ref_type == 'branch'
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: bun run lint:branch-name "$BRANCH_NAME"

      - name: Set up Chrome for browser tests
        uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Install service worker test browsers
        timeout-minutes: 10
        run: |
          # The runner's Azure mirror can stall while fetching WebKit dependencies.
          # Keep Ubuntu's signed packages, using its standard archive mirror.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          bun run --cwd packages/app-web browsers:install firefox webkit

      # scripts/testing/verify.json lists the checks, tests, browser suites,
      # builds, and mobile sync, so local `bun run verify` matches this step.
      - name: Check, test, build, and sync
        run: bun run verify
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          FASTLANE_OPT_OUT_USAGE: "1"
          FASTLANE_SKIP_UPDATE_CHECK: "1"

      - name: Require committed native projects to match the sync
        run: |
          native_paths=(packages/app-capacitor/ios packages/app-capacitor/android)
          test -z "$(git status --porcelain -- "${native_paths[@]}")" || {
            git status --short -- "${native_paths[@]}"
            exit 1
          }
